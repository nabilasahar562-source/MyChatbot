<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Chatbot</title>
<style>
  :root{
    --main:#6366f1; --main2:#8b5cf6;
    --bg:#f3f4f6; --panel:#ffffff; --chatbg:#eef2ff;
    --text:#1f2937; --muted:#6b7280; --border:#e5e7eb;
    --bot:#ffffff; --side:#f9fafb; --code:#f3f4f6;
  }
  :root[data-accent="indigo"]{--main:#6366f1;--main2:#8b5cf6;--chatbg:#eef2ff}
  :root[data-accent="emerald"]{--main:#059669;--main2:#0d9488;--chatbg:#ecfdf5}
  :root[data-accent="rose"]{--main:#e11d48;--main2:#ec4899;--chatbg:#fff1f2}
  :root[data-accent="sunset"]{--main:#ea580c;--main2:#f59e0b;--chatbg:#fff7ed}
  :root[data-accent="ocean"]{--main:#0284c7;--main2:#06b6d4;--chatbg:#f0f9ff}
  :root[data-accent="violet"]{--main:#7c3aed;--main2:#c026d3;--chatbg:#faf5ff}
  :root[data-theme="dark"]{
    --bg:#0f172a; --panel:#1e293b; --chatbg:#0f172a;
    --text:#e5e7eb; --muted:#9ca3af; --border:#334155;
    --bot:#1e293b; --side:#111827; --code:#0b1220;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}
  .app{display:flex;height:100vh}

  /* Sidebar */
  #side{width:275px;background:var(--side);border-right:1px solid var(--border);
        display:flex;flex-direction:column;padding:12px;gap:10px;transition:transform .25s}
  #newChat{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;border:none;
        padding:12px;border-radius:12px;font-size:15px;cursor:pointer}
  #search{padding:10px 12px;border:1px solid var(--border);border-radius:12px;font-size:14px;
        outline:none;background:var(--panel);color:var(--text)}
  #list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 10px 10px 12px;
        border-radius:10px;cursor:pointer;font-size:14px;color:var(--text)}
  .item:hover{background:var(--border)}
  .item.active{background:var(--border);font-weight:600}
  .item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .more{background:var(--panel);border:1px solid var(--border);color:var(--text);cursor:pointer;
        font-size:16px;line-height:1;width:30px;height:26px;border-radius:8px;flex-shrink:0}
  .more:hover{border-color:var(--main);color:var(--main)}
  .sbtn{background:var(--panel);color:var(--text);border:1px solid var(--border);
        padding:9px;border-radius:12px;cursor:pointer;font-size:14px}
  .sbtn:hover{border-color:var(--main)}
  .sbtn.danger:hover{border-color:#ef4444;color:#ef4444}
  #swatches{display:flex;gap:8px;justify-content:center;padding:4px 0}
  .sw{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer;
      outline:1px solid var(--border)}
  .sw.on{border-color:var(--text)}
  .swlabel{font-size:12px;color:var(--muted);text-align:center}

  /* Menu aur toast */
  #ctx{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--border);border-radius:12px;
       box-shadow:0 8px 24px rgba(0,0,0,.25);padding:6px;display:none;min-width:175px}
  #ctx button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);
       padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
  #ctx button:hover{background:var(--border)}
  #ctx button.red{color:#ef4444}
  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;
       padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;
       transition:opacity .25s;z-index:60;max-width:90%;text-align:center}
  #toast.show{opacity:1}

  /* Main */
  main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel)}
  main.drag{outline:3px dashed var(--main);outline-offset:-6px}
  .top{display:flex;align-items:center;gap:12px;padding:12px 18px;color:#fff;
       background:linear-gradient(135deg,var(--main),var(--main2))}
  #menu{display:none;background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
  .avatar{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25);
          display:flex;align-items:center;justify-content:center;font-size:22px}
  .top h1{font-size:18px} .top small{opacity:.9;font-size:12px}
  #mode{margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.4);
        border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer;outline:none;max-width:170px}
  #mode option{color:#111}
  #shareTop{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;
        border-radius:10px;width:38px;height:36px;cursor:pointer;font-size:16px}
  #box{flex:1;overflow-y:auto;padding:18px;background:var(--chatbg);
       display:flex;flex-direction:column;gap:12px}
  .row{display:flex;flex-direction:column;max-width:82%;animation:pop .2s ease}
  .row.user{align-self:flex-end;align-items:flex-end}
  .row.bot{align-self:flex-start;align-items:flex-start}
  .msg{padding:10px 14px;border-radius:16px;line-height:1.6;font-size:15px;word-wrap:break-word;max-width:100%}
  .user .msg{background:var(--main);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
  .user .msg img{max-width:100%;max-height:220px;border-radius:10px;display:block;margin-bottom:6px}
  .fchip{background:rgba(255,255,255,.2);padding:6px 10px;border-radius:10px;font-size:13px;
         margin-bottom:6px;display:inline-block;word-break:break-all}
  .bot .msg{background:var(--bot);color:var(--text);border-bottom-left-radius:4px;
            box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .msg p{margin:6px 0} .msg ul,.msg ol{margin:6px 0 6px 20px}
  .msg pre{background:var(--code);padding:10px;border-radius:8px;overflow-x:auto;margin:8px 0;font-size:13px}
  .msg code{background:var(--code);padding:1px 5px;border-radius:5px;font-size:13px}
  .msg pre code{padding:0;background:none}
  .actions{display:flex;gap:10px;margin-top:3px}
  .actions button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer}
  .actions button:hover{color:var(--main)}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .typing span{display:inline-block;width:7px;height:7px;margin:0 2px;background:#9ca3af;
       border-radius:50%;animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  #chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 10px;background:var(--chatbg)}
  .chip{background:var(--panel);color:var(--text);border:1px solid var(--border);
        padding:8px 14px;border-radius:20px;cursor:pointer;font-size:14px}
  .chip:hover{border-color:var(--main)}

  #pending{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);
        border-top:1px solid var(--border);font-size:13px;color:var(--text)}
  #pending img{height:46px;border-radius:8px}
  #pending span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pending button{margin-left:auto;background:var(--bg);border:1px solid var(--border);color:var(--text);
        border-radius:50%;width:28px;height:28px;cursor:pointer;flex-shrink:0}

  .inputbar{display:flex;align-items:flex-end;gap:10px;padding:14px;border-top:1px solid var(--border);background:var(--panel)}
  #msg{flex:1;padding:12px 16px;border:1px solid var(--border);border-radius:22px;font-size:15px;
       outline:none;background:var(--bg);color:var(--text);resize:none;max-height:120px;
       line-height:1.4;font-family:inherit;height:46px}
  #msg:focus{border-color:var(--main)}
  #send{background:var(--main);color:#fff;border:none;border-radius:25px;padding:0 22px;
        font-size:15px;cursor:pointer;height:46px;min-width:100px}
  #send.stop{background:#ef4444}
  #msg:disabled{opacity:.6;cursor:not-allowed}
  .iconbtn{background:var(--bg);border:1px solid var(--border);border-radius:50%;width:46px;height:46px;
       cursor:pointer;font-size:18px;flex-shrink:0}
  .iconbtn:disabled{opacity:.5;cursor:not-allowed}
  .iconbtn.on{background:#ef4444;color:#fff}

  /* Mobile */
  #overlay{display:none}
  @media (max-width:760px){
    #side{position:fixed;top:0;bottom:0;left:0;z-index:20;transform:translateX(-100%);overflow-y:auto}
    #side.open{transform:none}
    #overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10}
    #menu{display:block}
    .row{max-width:92%}
    .top small{display:none}
    #mode{max-width:120px}
    .inputbar{gap:6px;padding:10px}
    #send{min-width:80px;padding:0 14px}
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <button id="newChat">➕ New Chat</button>
    <input id="search" placeholder="🔍 Search chats" autocomplete="off">
    <div id="list"></div>
    <div class="swlabel">🎨 Color theme</div>
    <div id="swatches"></div>
    <button class="sbtn" id="exportBtn">⬇️ Export chat</button>
    <button class="sbtn danger" id="clearAll">🗑️ Clear all chats</button>
    <button class="sbtn" id="theme">🌙 Dark mode</button>
  </aside>
  <div id="overlay"></div>

  <main id="mainArea">
    <div class="top">
      <button id="menu">☰</button>
      <div class="avatar">🤖</div>
      <div><h1>My Chatbot</h1><small>🟢 Online</small></div>
      <select id="mode">
        <option value="assistant">💬 Friendly Assistant</option>
        <option value="teacher">👩‍🏫 Teacher</option>
        <option value="coder">💻 Python Tutor</option>
        <option value="interview">🎯 Interview Coach</option>
        <option value="english">🇬🇧 English Practice</option>
      </select>
      <button id="shareTop" title="Share this chat">📤</button>
    </div>
    <div id="box"></div>
    <div id="chips"></div>
    <div id="pending"></div>
    <div class="inputbar">
      <button class="iconbtn" id="attachBtn" title="Attach image or file">📎</button>
      <input type="file" id="fileInput" hidden
        accept="image/*,.pdf,.docx,.txt,.md,.csv,.json,.py,.js,.html,.css">
      <button class="iconbtn" id="mic" title="Voice input">🎤</button>
      <textarea id="msg" rows="1" placeholder="Type your message... ✍️"></textarea>
      <button id="send">Send 🚀</button>
    </div>
  </main>
</div>

<div id="ctx"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const box = $("box"), input = $("msg"), btn = $("send"), modeSel = $("mode");

const WELCOME = "Assalam-o-Alaikum 👋\nWelcome! How can I assist you today? 😊";
const SUGGESTIONS = {
  assistant: ["💡 Study tips do", "📝 Mera quiz lo", "😄 Koi mazahiya baat sunao", "🧠 Mujhe kuch naya sikhao"],
  teacher:   ["📚 Photosynthesis samjhao", "➗ Algebra asaan tareeqe se", "🌍 Climate change kya hai?"],
  coder:     ["🐍 Python kya hai?", "🔁 Loops samjhao", "🧩 Ek chhota exercise do"],
  interview: ["🎤 Mera mock interview lo", "📄 Common questions batao", "💼 Apna introduction kaise dein?"],
  english:   ["🗣️ Let's talk in English", "✏️ Meri grammar check karo", "📖 Naye words sikhao"]
};
const ACCENTS = {
  emerald:["#059669","#0d9488","Emerald"],
  indigo:["#6366f1","#8b5cf6","Indigo"],
  rose:["#e11d48","#ec4899","Rose"],
  sunset:["#ea580c","#f59e0b","Sunset"],
  ocean:["#0284c7","#06b6d4","Ocean"],
  violet:["#7c3aed","#c026d3","Violet"]
};

let chats = [], currentId = null, busy = false, controller = null, ctxId = null, pending = null;

/* ---------- Storage ---------- */
function loadChats(){
  try{ return JSON.parse(localStorage.getItem("mychat_chats")) || []; }catch(e){ return []; }
}
function saveChats(){
  try{ localStorage.setItem("mychat_chats", JSON.stringify(chats)); return true; }catch(e){}
  // Jagah kam hai: sirf sab se nayi tasveer rakhte hain, purani hata dete hain
  let last = null;
  chats.forEach(c => c.messages.forEach(m => {
    if(m.image){ if(last) delete last.image; last = m; }
  }));
  try{ localStorage.setItem("mychat_chats", JSON.stringify(chats)); return true; }catch(e){}
  chats.forEach(c => c.messages.forEach(m => { delete m.image; }));
  try{ localStorage.setItem("mychat_chats", JSON.stringify(chats)); return true; }catch(e){}
  return false;
}
function getCurrent(){ return chats.find(c => c.id === currentId); }

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
}

/* ---------- Theme + colors ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("theme").textContent = t === "dark" ? "☀️ Light mode" : "🌙 Dark mode";
  try{ localStorage.setItem("mychat_theme", t); }catch(e){}
}
$("theme").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme");
  applyTheme(now === "dark" ? "light" : "dark");
};
function applyAccent(name){
  if(!ACCENTS[name]) name = "emerald";
  document.documentElement.setAttribute("data-accent", name);
  document.querySelectorAll(".sw").forEach(s => s.classList.toggle("on", s.dataset.name === name));
  try{ localStorage.setItem("mychat_accent", name); }catch(e){}
}
function buildSwatches(){
  const wrap = $("swatches");
  Object.keys(ACCENTS).forEach(name => {
    const s = document.createElement("button");
    s.className = "sw"; s.dataset.name = name; s.title = ACCENTS[name][2];
    s.style.background = "linear-gradient(135deg," + ACCENTS[name][0] + "," + ACCENTS[name][1] + ")";
    s.onclick = () => applyAccent(name);
    wrap.appendChild(s);
  });
}

/* ---------- Markdown ---------- */
function renderMd(el, text){
  if(window.marked && window.DOMPurify){
    el.innerHTML = DOMPurify.sanitize(marked.parse(text, {breaks:true}));
  }else{
    el.textContent = text;
    el.style.whiteSpace = "pre-wrap";
  }
}

/* ---------- Messages ---------- */
function addUser(m){
  const row = document.createElement("div");
  row.className = "row user";
  const bub = document.createElement("div");
  bub.className = "msg";
  if(m.image){
    const im = document.createElement("img");
    im.src = m.image;
    bub.appendChild(im);
  }else if(m.doc){
    const f = document.createElement("div");
    f.className = "fchip"; f.textContent = "📄 " + m.doc.name;
    bub.appendChild(f);
  }else if(m.attName){
    const f = document.createElement("div");
    f.className = "fchip"; f.textContent = "🖼️ " + m.attName + " (purani tasveer)";
    bub.appendChild(f);
  }
  if(m.content){
    const t = document.createElement("div");
    t.textContent = m.content;
    bub.appendChild(t);
  }
  row.appendChild(bub);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
}
function addBot(text, showTyping){
  const row = document.createElement("div");
  row.className = "row bot";
  const m = document.createElement("div");
  m.className = "msg";
  if(showTyping){
    m.classList.add("typing");
    m.innerHTML = "<span></span><span></span><span></span>";
  }else{
    renderMd(m, text);
  }
  row.appendChild(m);
  box.appendChild(row);
  box.scrollTop = box.scrollHeight;
  return {row, m};
}
function removeRegen(){ document.querySelectorAll(".regen").forEach(e => e.remove()); }
function addActions(row, text, isLast){
  const wrap = document.createElement("div");
  wrap.className = "actions";
  const c = document.createElement("button");
  c.textContent = "📋 Copy";
  c.onclick = () => {
    navigator.clipboard.writeText(text).then(() => {
      c.textContent = "✅ Copied";
      setTimeout(() => c.textContent = "📋 Copy", 1500);
    }).catch(() => {});
  };
  wrap.appendChild(c);
  if(isLast){
    const r = document.createElement("button");
    r.className = "regen"; r.textContent = "🔄 Regenerate";
    r.onclick = regenerate;
    wrap.appendChild(r);
  }
  row.appendChild(wrap);
}

/* ---------- Sidebar list (pinned sab se upar) ---------- */
function renderList(){
  const list = $("list");
  const q = $("search").value.trim().toLowerCase();
  list.innerHTML = "";
  const sorted = [...chats].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  sorted.filter(c => c.title.toLowerCase().includes(q)).forEach(c => {
    const d = document.createElement("div");
    d.className = "item" + (c.id === currentId ? " active" : "");
    const s = document.createElement("span");
    s.textContent = (c.pinned ? "📌 " : "💬 ") + c.title;
    const x = document.createElement("button");
    x.className = "more"; x.textContent = "⋯"; x.title = "Options";
    x.onclick = e => { e.stopPropagation(); openMenu(c.id, x); };
    d.onclick = () => openChat(c.id);
    d.appendChild(s); d.appendChild(x);
    list.appendChild(d);
  });
}
$("search").addEventListener("input", renderList);
function closeSide(){ $("side").classList.remove("open"); $("overlay").classList.remove("show"); }
$("menu").onclick = () => { $("side").classList.add("open"); $("overlay").classList.add("show"); };
$("overlay").onclick = closeSide;

/* ---------- Per-chat menu: Pin / Share / Rename / Delete ---------- */
function openMenu(id, anchor){
  ctxId = id;
  const c = chats.find(x => x.id === id);
  if(!c) return;
  const m = $("ctx");
  m.innerHTML = "";
  const items = [
    [c.pinned ? "📌 Unpin chat" : "📌 Pin chat", () => pinChat(id), ""],
    ["📤 Share chat", () => shareChat(id), ""],
    ["✏️ Rename", () => renameChat(id), ""],
    ["🗑️ Delete chat", () => deleteChat(id), "red"]
  ];
  items.forEach(([label, fn, cls]) => {
    const b = document.createElement("button");
    b.textContent = label;
    if(cls) b.className = cls;
    b.onclick = e => { e.stopPropagation(); closeMenu(); fn(); };
    m.appendChild(b);
  });
  m.style.display = "block";
  const r = anchor.getBoundingClientRect();
  let left = Math.min(r.left, window.innerWidth - m.offsetWidth - 10);
  let top = r.bottom + 4;
  if(top + m.offsetHeight > window.innerHeight - 10) top = r.top - m.offsetHeight - 4;
  m.style.left = Math.max(10, left) + "px";
  m.style.top = Math.max(10, top) + "px";
}
function closeMenu(){ $("ctx").style.display = "none"; }
document.addEventListener("click", closeMenu);
window.addEventListener("resize", closeMenu);
$("list").addEventListener("scroll", closeMenu);

function pinChat(id){
  const c = chats.find(x => x.id === id);
  if(!c) return;
  c.pinned = !c.pinned;
  saveChats(); renderList();
  toast(c.pinned ? "📌 Chat pin ho gayi" : "Chat unpin ho gayi");
}
function renameChat(id){
  const c = chats.find(x => x.id === id);
  if(!c) return;
  const n = prompt("Chat ka naya naam likhein:", c.title);
  if(n && n.trim()){
    c.title = n.trim().slice(0, 40);
    saveChats(); renderList();
  }
}
function chatToText(c){
  return "💬 " + c.title + "\n\n" +
    c.messages.map(m =>
      (m.role === "user" ? "You: " : "Bot: ") +
      (m.attName ? "[Attached: " + m.attName + "] " : "") + m.content
    ).join("\n\n");
}
async function shareChat(id){
  const c = chats.find(x => x.id === id);
  if(!c || !c.messages.length){ toast("Share karne ke liye pehle chat karein 🙂"); return; }
  const text = chatToText(c);
  if(navigator.share){
    try{ await navigator.share({title: c.title, text}); return; }
    catch(e){ if(e.name === "AbortError") return; }
  }
  try{
    await navigator.clipboard.writeText(text);
    toast("✅ Chat copy ho gayi, ab kahin bhi paste karke share karein");
  }catch(e){
    toast("Copy nahi ho saka 😕");
  }
}
$("shareTop").onclick = () => shareChat(currentId);

/* ---------- Chat management ---------- */
function newChat(){
  if(busy) return;
  const empty = chats.find(c => c.messages.length === 0);
  if(empty){
    empty.mode = modeSel.value;
    currentId = empty.id;
  }else{
    const c = {id: Date.now(), title: "New Chat", messages: [], mode: modeSel.value, pinned: false};
    chats.unshift(c); currentId = c.id;
  }
  clearPending();
  saveChats(); renderAll(); closeSide(); input.focus();
}
function openChat(id){
  if(busy) return;
  currentId = id; clearPending(); renderAll(); closeSide();
}
function deleteChat(id){
  if(busy) return;
  if(!confirm("Kya aap ye chat delete karna chahti hain? 🗑️")) return;
  chats = chats.filter(c => c.id !== id);
  saveChats();
  if(currentId === id){
    if(chats.length){ currentId = chats[0].id; }
    else{ newChat(); return; }
  }
  renderAll();
}
$("clearAll").onclick = () => {
  if(busy) return;
  if(!confirm("Saari chats delete ho jayengi (pin ki hui bhi). Pakka delete karein?")) return;
  chats = []; saveChats(); newChat();
};
function renderChips(show){
  const ch = $("chips");
  ch.innerHTML = "";
  if(!show) return;
  (SUGGESTIONS[modeSel.value] || SUGGESTIONS.assistant).forEach(t => {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = t;
    b.onclick = () => send(t);
    ch.appendChild(b);
  });
}
function renderAll(){
  const chat = getCurrent();
  if(chat) modeSel.value = chat.mode || "assistant";
  renderList();
  box.innerHTML = "";
  if(!chat || chat.messages.length === 0){
    addBot(WELCOME, false);
    renderChips(true);
    return;
  }
  renderChips(false);
  const lastIdx = chat.messages.length - 1;
  chat.messages.forEach((m, i) => {
    if(m.role === "user"){ addUser(m); }
    else{
      const b = addBot(m.content, false);
      addActions(b.row, m.content, i === lastIdx);
    }
  });
}
modeSel.onchange = () => {
  const chat = getCurrent();
  if(chat){
    chat.mode = modeSel.value; saveChats();
    if(chat.messages.length === 0) renderChips(true);
  }
};

/* ---------- Attachments ---------- */
function renderPending(){
  const p = $("pending");
  p.innerHTML = "";
  if(!pending){ p.style.display = "none"; return; }
  p.style.display = "flex";
  if(pending.type === "image"){
    const im = document.createElement("img");
    im.src = pending.dataUrl;
    p.appendChild(im);
  }
  const n = document.createElement("span");
  n.textContent = (pending.type === "image" ? "🖼️ " : "📄 ") + pending.name;
  p.appendChild(n);
  const x = document.createElement("button");
  x.textContent = "✕"; x.title = "Remove";
  x.onclick = clearPending;
  p.appendChild(x);
}
function clearPending(){ pending = null; renderPending(); }

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1024;
      let w = img.width, h = img.height;
      if(w > max || h > max){
        const s = max / Math.max(w, h);
        w = Math.round(w * s); h = Math.round(h * s);
      }
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.7));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

async function handleFile(file){
  if(!file || busy) return;
  if(file.size > 10 * 1024 * 1024){ toast("File bohat bari hai (max 10 MB) 😕"); return; }
  try{
    if(file.type.startsWith("image/")){
      toast("🖼️ Tasveer tayyar ho rahi hai...");
      const dataUrl = await resizeImage(file);
      pending = {type:"image", name: file.name || "image", dataUrl};
    }else{
      toast("📄 File parhi ja rahi hai...");
      const fd = new FormData();
      fd.append("file", file);
      const res = await fetch("/extract", {method:"POST", body: fd});
      const d = await res.json();
      if(!res.ok){ toast(d.error || "File parh nahi saki 😕"); return; }
      pending = {type:"doc", name: file.name, text: d.text};
      if(d.truncated) toast("Lambi file ka sirf shuru ka hissa liya gaya ✂️");
    }
    renderPending();
    input.focus();
  }catch(e){
    toast("Attach nahi ho saka 😕");
  }
}
$("attachBtn").onclick = () => { if(!busy) $("fileInput").click(); };
$("fileInput").onchange = e => { handleFile(e.target.files[0]); e.target.value = ""; };

// Ctrl + V se tasveer paste karna
input.addEventListener("paste", e => {
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const it of items){
    if(it.type.startsWith("image/")){
      e.preventDefault();
      handleFile(it.getAsFile());
      return;
    }
  }
});
// Drag and drop
const mainArea = $("mainArea");
mainArea.addEventListener("dragover", e => { e.preventDefault(); mainArea.classList.add("drag"); });
mainArea.addEventListener("dragleave", () => mainArea.classList.remove("drag"));
mainArea.addEventListener("drop", e => {
  e.preventDefault();
  mainArea.classList.remove("drag");
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

/* ---------- Server ko bhejne ke liye messages ---------- */
function apiMessages(chat){
  const ms = chat.messages;
  let lastDoc = -1;
  ms.forEach((m, i) => { if(m.doc) lastDoc = i; });
  return ms.map((m, i) => {
    const o = {role: m.role, content: m.content || ""};
    if(m.doc){
      o.content = (i === lastDoc)
        ? "📎 File: " + m.doc.name + "\n-----\n" + m.doc.text + "\n-----\n\n" + (m.content || "Please summarize this file.")
        : "[File '" + m.doc.name + "' was attached earlier] " + (m.content || "");
    }
    if(m.image) o.image = m.image;
    return o;
  });
}

/* ---------- Send + streaming ---------- */
function setBusy(b){
  busy = b;
  input.disabled = b;
  $("attachBtn").disabled = b;
  btn.textContent = b ? "⏹ Stop" : "Send 🚀";
  btn.classList.toggle("stop", b);
  if(!b) input.focus();
}
function resetInputHeight(){ input.style.height = "46px"; }

function send(textArg){
  if(busy) return;
  const text = (typeof textArg === "string" ? textArg : input.value).trim();
  if(!text && !pending) return;
  const chat = getCurrent();
  if(!chat) return;

  const msg = {role:"user", content:text};
  if(pending){
    if(pending.type === "image") msg.image = pending.dataUrl;
    else msg.doc = {name: pending.name, text: pending.text};
    msg.attName = pending.name;
  }
  if(chat.messages.length === 0){
    box.innerHTML = "";
    renderChips(false);
    chat.title = (text || pending.name).slice(0, 28);
  }
  chat.messages.push(msg);
  saveChats(); renderList();
  addUser(msg);
  input.value = ""; resetInputHeight(); clearPending();
  reply();
}

async function reply(){
  const chat = getCurrent();
  if(!chat) return;
  setBusy(true);
  removeRegen();
  const bot = addBot("", true);
  let full = "";
  controller = new AbortController();
  try{
    const res = await fetch("/chat", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({messages: apiMessages(chat), mode: chat.mode || "assistant"}),
      signal: controller.signal
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    bot.m.classList.remove("typing");
    bot.m.innerHTML = "";
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      full += dec.decode(value, {stream:true});
      renderMd(bot.m, full);
      box.scrollTop = box.scrollHeight;
    }
    if(!full.trim()){
      full = "Jawab nahi aaya 😕 Dobara try karein.";
      renderMd(bot.m, full);
    }
    chat.messages.push({role:"assistant", content:full});
    saveChats();
    addActions(bot.row, full, true);
  }catch(e){
    if(e.name === "AbortError" && full.trim()){
      bot.m.classList.remove("typing");
      chat.messages.push({role:"assistant", content:full});
      saveChats();
      addActions(bot.row, full, true);
    }else{
      const last = chat.messages.pop();
      saveChats();
      renderAll();
      if(last && last.role === "user") input.value = last.content;
      if(e.name !== "AbortError") addBot("Connection mein masla aaya 😕 Dobara try karein.", false);
    }
  }
  controller = null;
  setBusy(false);
}

function stopReply(){ if(controller) controller.abort(); }

function regenerate(){
  if(busy) return;
  const chat = getCurrent();
  if(!chat || !chat.messages.length) return;
  if(chat.messages[chat.messages.length - 1].role === "assistant") chat.messages.pop();
  saveChats(); renderAll(); reply();
}

/* ---------- Export ---------- */
$("exportBtn").onclick = () => {
  const chat = getCurrent();
  if(!chat || !chat.messages.length){
    toast("Export karne ke liye pehle chat karein 🙂");
    return;
  }
  const blob = new Blob([chatToText(chat)], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (chat.title || "chat").replace(/[\\/:*?"<>|]/g, "") + ".txt";
  a.click();
  URL.revokeObjectURL(a.href);
};

/* ---------- Voice input ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  const rec = new SR();
  rec.lang = "ur-PK";
  rec.interimResults = false;
  rec.onresult = e => {
    input.value = (input.value + " " + e.results[0][0].transcript).trim();
    input.dispatchEvent(new Event("input"));
  };
  rec.onend = () => $("mic").classList.remove("on");
  rec.onerror = () => $("mic").classList.remove("on");
  $("mic").onclick = () => {
    if(busy) return;
    try{ rec.start(); $("mic").classList.add("on"); }catch(e){}
  };
}else{
  $("mic").style.display = "none";
}

/* ---------- Input events ---------- */
btn.onclick = () => { busy ? stopReply() : send(); };
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    if(!busy) send();
  }
});
input.addEventListener("input", () => {
  input.style.height = "46px";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});
$("newChat").onclick = newChat;
